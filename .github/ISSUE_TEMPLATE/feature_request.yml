name: ✨ Feature Request
description: Propose a new capability or improvement for Wild AgentOS
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or questions, please use
        [Discussions](https://github.com/skaiy/wild_agentos/discussions) instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What limitation or pain point motivates this request?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the behaviour or API you would like to see.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - wildcode CLI / TUI
        - Core agent runner (PDCA loop)
        - Knowledge graph / ontology
        - Skill graph / security gates
        - Tool executor / MCP integration
        - Memory & context compression
        - HTTP API / gateway
        - Build, CI, or deployment
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you evaluated and why they fall short.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Use cases, references, prior art, or sketches.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request implementing this feature.
        - label: I searched existing issues and did not find a duplicate.
          required: true
