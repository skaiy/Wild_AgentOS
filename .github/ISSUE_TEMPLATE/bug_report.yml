name: 🐛 Bug Report
description: Report a reproducible problem in Wild AgentOS
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please do **not** include
        API keys, tokens, or other credentials in logs you paste here.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include error messages, stack traces, or relevant log output.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - wildcode CLI / TUI
        - Core agent runner (PDCA loop)
        - Knowledge graph / ontology
        - Skill graph / security gates
        - Tool executor / MCP integration
        - Memory & context compression
        - HTTP API / gateway
        - Build, CI, or deployment
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or Commit SHA
      placeholder: "v0.1.0 or 68ac3f9"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and Rust toolchain version.
      placeholder: "macOS 15.4 arm64, rustc 1.85.0"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Configuration, model provider, or anything else relevant.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed all secrets and credentials from the content above.
          required: true
