# 密钥模板 —— 请勿把真实密钥提交进仓库!
# 用法(推荐,值不落盘到 git):
#   kubectl -n wild-agentos create secret generic wild-agentos-core-secret \
#     --from-literal=AGENT_OS_GATEWAY_API_KEY='<真实网关key>' \
#     --from-literal=AGENT_OS_EMBEDDING_ONEAPI_API_KEY='<真实embedding key>'
#
# 或复制本文件为 secret.yaml,填入 stringData 后 apply(secret.yaml 已在 .gitignore 忽略)。
apiVersion: v1
kind: Secret
metadata:
  name: wild-agentos-core-secret
  namespace: wild-agentos
type: Opaque
stringData:
  AGENT_OS_GATEWAY_API_KEY: "REPLACE_ME"
  AGENT_OS_EMBEDDING_ONEAPI_API_KEY: "REPLACE_ME"
